
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Criteria | Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .criteria-page {
            max-width: 850px;
            margin: 40px auto;
            padding: 25px;
            color: #f4f6ff;
        }

        .criteria-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 8px;
            background: #141e33;
            color: white;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #7565f5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .success-message {
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #22c55e;
            border-radius: 8px;
            color: #4ade80;
            background: rgba(34,197,94,.12);
        }

        .error-message {
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ef4444;
            border-radius: 8px;
            color: #ff7777;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #a5b4fc;
            text-decoration: none;
        }
    </style>
</head>

<body>

<main class="criteria-page">

    <a href="{{ url_for('dashboard') }}" class="back-link">
        ← Back to Dashboard
    </a>

    <h1>Job Criteria</h1>
    <p>Enter job details and required skills for resume comparison.</p>

    {% if success_message %}
        <div class="success-message">
            ✓ {{ success_message }}
        </div>
    {% endif %}

    {% if error_message %}
        <div class="error-message">
            {{ error_message }}
        </div>
    {% endif %}

    <form class="criteria-form"
          id="criteriaForm"
          method="POST"
          action="{{ url_for('job_criteria') }}">

        <div class="form-group">
            <label for="jobTitle">Job Title *</label>
            <input type="text"
                   id="jobTitle"
                   name="jobTitle"
                   value="{{ saved_criteria['job_title'] if saved_criteria else '' }}"
                   placeholder="Software Developer"
                   required>
        </div>

        <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text"
                   id="companyName"
                   name="companyName"
                   value="{{ saved_criteria['company_name'] if saved_criteria else '' }}"
                   placeholder="ABC Technologies">
        </div>

        <div class="form-group">
            <label for="education">Required Education</label>
            <input type="text"
                   id="education"
                   name="education"
                   value="{{ saved_criteria['education'] if saved_criteria else '' }}"
                   placeholder="B.Tech CSE / IT">
        </div>

        <div class="form-group">
            <label for="experience">Experience</label>
            <input type="text"
                   id="experience"
                   name="experience"
                   value="{{ saved_criteria['experience'] if saved_criteria else '' }}"
                   placeholder="Fresher (0-1 Years)">
        </div>

        <div class="form-group">
            <label for="requiredSkills">Required Skills *</label>
            <textarea id="requiredSkills"
                      name="requiredSkills"
                      placeholder="Python, Java, DSA, HTML, CSS, JavaScript, SQL"
                      required>{{ saved_criteria['required_skills'] if saved_criteria else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="jobDescription">Job Description *</label>
            <textarea id="jobDescription"
                      name="jobDescription"
                      placeholder="Enter job responsibilities and requirements..."
                      required>{{ saved_criteria['job_description'] if saved_criteria else '' }}</textarea>
        </div>

        <button type="submit" class="save-btn">
            Save Job Criteria
        </button>

    </form>

</main>

</body>
</html>
